# Development docker-compose with hot reload
services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: migrate_mysql_postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-migrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migrate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-migrate_mysql}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-migrate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend with hot reload
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: migrate_mysql_backend_dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-migrate}:${POSTGRES_PASSWORD:-migrate_secret}@postgres:5432/${POSTGRES_DB:-migrate_mysql}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./packages/backend/migrate_mysql:/app/migrate_mysql
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend with hot reload
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    container_name: migrate_mysql_frontend_dev
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/src
      - ./packages/frontend/public:/app/public
    depends_on:
      - backend

volumes:
  postgres_data_dev:
