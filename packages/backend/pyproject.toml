[project]
name = "migrate-mysql"
version = "0.1.0"
description = "MySQL database migration tool with table filtering support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mysql-connector-python>=8.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
migrate-mysql = "migrate_mysql.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
