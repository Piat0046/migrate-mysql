[project]
name = "migrate-mysql"
version = "0.1.0"
description = "MySQL database migration tool with table filtering support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mysql-connector-python>=8.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.6",
    "apscheduler>=3.10.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
migrate-mysql = "migrate_mysql.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
