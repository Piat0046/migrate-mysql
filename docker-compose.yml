services:
  # PostgreSQL database for storing history, schedules, users
  postgres:
    image: postgres:16-alpine
    container_name: migrate_mysql_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-migrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migrate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-migrate_mysql}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-migrate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: migrate_mysql_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-migrate}:${POSTGRES_PASSWORD:-migrate_secret}@postgres:5432/${POSTGRES_DB:-migrate_mysql}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: migrate_mysql_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
